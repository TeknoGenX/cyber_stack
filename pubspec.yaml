name: cyber_stack
description: "A cyberpunk arcade stacking mobile game built with Flutter and Flame."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flame: ^1.18.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  material_ui: ^1.11.0
  flame_audio: ^2.12.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/